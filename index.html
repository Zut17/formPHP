<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulaire de choix de matiere</h1>
    <form action="resultat.php" method="post">
        <label for="nom">Nom :</label>
        <input type="text" name="nom" id="nom" required>
        <label for="prenom">Prénom :</label>
        <input type="text" name="prenom" id="prenom" required>
        <label for="age">Age :</label>
        <input type="number" name="age" id="age" min="0">
        <label for="sexe">Sexe :</label>
        <input type="radio" name="sexe" id="sexe" value="M">: M
        <input type="radio" name="sexe" id="sexe" value="F">: F
        <label for="matiere">Selectionnez vos matières :</label>
        <input type="checkbox" name="matieres[]" id="matiere" value="Maths"> : Mathématiques
        <input type="checkbox" name="matieres[]" id="matiere" value="français"> : Français
        <input type="checkbox" name="matieres[]" id="matiere" value="histoire"> : Histoire
        <input type="checkbox" name="matieres[]" id="matiere" value="geographie"> : Géographie
        <input type="checkbox" name="matieres[]" id="matiere" value="sciences"> : Sciences
        <button id="addNote">Ajouter une note</button>
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
