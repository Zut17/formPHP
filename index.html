<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Formulaire de choix de matiere</h1>
    <form action="resultat.php" method="post">
        <label for="nom">Nom :</label>
        <input type="text" name="nom" id="nom" required>
        <label for="prenom">Prénom :</label>
        <input type="text" name="prenom" id="prenom" required>
        <label for="age">Age :</label>
        <input type="number" name="age" id="age" min="0">
        <label for="sexe">Sexe :</label>
        <section class="sexeRadio">
            <label><input type="radio" name="sexe" id="sexeM" value="M">: Masculin</label>
            <label><input type="radio" name="sexe" id="sexeF" value="F">: Féminin</label>
        </section>
        <label for="matiere">Selectionnez vos matières :</label>
        <section class="matiereList">
            <label><input type="checkbox" name="matieres[]" value="Mathématiques"> : Mathématiques</label>
            <label><input type="checkbox" name="matieres[]" value="Français"> : Français</label>
            <label><input type="checkbox" name="matieres[]" value="Histoire"> : Histoire</label>
            <label><input type="checkbox" name="matieres[]" value="Géographie"> : Géographie</label>
            <label><input type="checkbox" name="matieres[]" value="Sciences"> : Sciences</label>
        </section>
        <button type="button" id="btnAddNote"><i class="fa-regular fa-comments"></i> Ajouter une note</button>
        <div class="noteContainer"></div>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Envoyer</button>
    </form>
    <script src="js/script.js"></script>
</body>
</html>
